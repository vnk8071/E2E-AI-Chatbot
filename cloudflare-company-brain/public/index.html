<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Company Brain</title>
<style>
body{font:15px/1.5 system-ui,sans-serif;max-width:820px;margin:0 auto;padding:16px;background:#f6f1e7;color:#222}
h1{font-size:20px} section{background:#fff;border-radius:10px;padding:14px;margin-bottom:16px}
input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:4px 0;border:1px solid #bbb;border-radius:6px;font:inherit}
button{background:#5d7a58;color:#fff;border:0;border-radius:6px;padding:8px 14px;cursor:pointer}
.msg{white-space:pre-wrap;margin:8px 0;padding:8px;border-radius:6px;background:#eef3ec}.q{background:#f1f1f1}
.src{font-size:13px;color:#555;margin-top:4px}.warn{color:#b00020;font-size:13px}
</style></head><body>
<h1>Company Brain Assistant</h1>
<section><div id="log"></div>
<input id="q" placeholder="Ask about products, brand rules, SOPs, research…">
<button id="ask">Ask</button> <button id="reset" style="background:#888">New chat</button></section>
<section><b>Generate a creative brief</b>
<input id="product" placeholder="Product (e.g. Dew Drop Serum)">
<input id="audience" placeholder="Audience (e.g. sensitive-skin women 25-34)">
<input id="goal" placeholder="Goal (e.g. first-order conversion on short-form video)">
<button id="brief">Generate brief</button><div id="briefOut"></div></section>
<script>
const sid = crypto.randomUUID(); const $ = id => document.getElementById(id);
const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const post = (p, b) => fetch(p, {method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(b)}).then(r => r.json());
function render(d){
  if(d.error) return `<div class="msg warn">${esc(d.error)}</div>`;
  const src = (d.sources||[]).map(s => `[${s.n}] ${esc(s.title)} (${esc(s.doc)})`).join('<br>');
  const tag = d.blocked ? `<div class="warn">🛡 Blocked by guardrails (${esc(d.blocked)})</div>` : d.cached ? `<div class="src">⚡ cached</div>` : '';
  const w = (d.violations||[]).map(x => `<div class="warn">⚠ ${esc(x)}</div>`).join('');
  return `<div class="msg">${esc(d.answer||'')}${src?`<div class="src">${src}</div>`:''}${tag}${w}</div>`;
}
$('ask').onclick = async () => {
  const q = $('q').value.trim(); if(!q) return; $('q').value='';
  $('log').insertAdjacentHTML('beforeend', `<div class="msg q">${esc(q)}</div>`);
  $('log').insertAdjacentHTML('beforeend', render(await post('/api/chat',{question:q,sessionId:sid})));
};
$('q').onkeydown = e => { if(e.key==='Enter') $('ask').click(); };
$('reset').onclick = async () => { await post('/api/reset',{sessionId:sid}); $('log').innerHTML=''; };
$('brief').onclick = async () => {
  $('briefOut').innerHTML='Generating…';
  $('briefOut').innerHTML = render(await post('/api/brief',{product:$('product').value,audience:$('audience').value,goal:$('goal').value}));
};
</script></body></html>
